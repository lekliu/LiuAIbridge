# ─────────────────────────────────────────────────────────────────────────────
# LiuAIbridge – Cloudflare Workers Configuration
# Docs: https://developers.cloudflare.com/workers/wrangler/configuration/
# ─────────────────────────────────────────────────────────────────────────────

name            = "liuaibridge"
main            = "src/index.ts"
compatibility_date = "2024-09-23"

[placement]
mode = "smart"

[[kv_namespaces]]
binding    = "LIU_BRIDGE_KV"
id         = "c9ea55aec1af47edb7d2d75a2150559f"
preview_id = "YOUR_KV_PREVIEW_NAMESPACE_ID"

[vars]
# ADMIN_TOKEN  = ""   # populate via: wrangler secret put ADMIN_TOKEN
# BRIDGE_TOKEN = ""   # populate via: wrangler secret put BRIDGE_TOKEN

# LiuKV 统计数据存储配置（可选）
# LIUKV_ENDPOINT = ""  # populate via: wrangler secret put LIUKV_ENDPOINT  # e.g. https://nkv.703803.xyz
# LIUKV_TOKEN = ""     # populate via: wrangler secret put LIUKV_TOKEN     # e.g. KV123456
# LIUKV_NAMESPACE = "" # populate via: wrangler secret put LIUKV_NAMESPACE # e.g. liuaibridge

# [routes]
# routes = [
#   { pattern = "ai-bridge.example.com/*", zone_name = "example.com" }
# ]

[observability]
enabled = true
